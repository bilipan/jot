      "type": "note",
      "title": "我的 AI 当着面骂了我一顿",
      "content": "**那天早上，我照例送完孩子，在公园里溜达。**\n\n阳光穿过树叶，斑驳的光影打在地上。我打开 flomo，想随便记点什么。\n\n然后我看到了它。\n\n**AI 给我生成了一份\"洞察报告\"——说的全是我，但比我更了解我自己。**\n\n---\n\n### 原来我一直在骗自己\n\n报告里说：\n\n> *\"从2018年那个未发布的应用开始，你就明白'能跑就发'的道理。但奇怪的是，7年过去了，你还在笔记里反复告诫自己——'快速发布'、'别追求完美'。\"*\n\n**7年。**\n\n同样的教训，我写了不知道多少遍。\n\nAI 毫不客气地戳穿：\n> *\"你的认知已经到位，但执行时总被'还没准备好'的心态羁绊。\"*\n\n我盯着这句话看了很久。\n\n**它说的对。**\n\n我知道该快速发布，但每次到临门一脚，我就会想：\n- \"这个功能还没优化好...\"\n- \"界面可以再精致一点...\"\n- \"等我把这个技术栈研究透...\"\n\n然后，项目就进了坟墓。\n\n---\n\n### 完美主义是个体面的借口\n\n我以前以为这是**对技术的执着**。\n\n但 AI 说得更狠：\n> *\"你不断涌出的新想法和对新技术的探索，可能是一种逃避——用规划替代行动，用可能性取代交付成果。\"*\n\n**操。**\n\n这话说得太准了。\n\n学新技术很爽，因为你在\"进步\"。\n写计划很爽，因为你在\"准备\"。\n但真正的发布？**那意味着可能被评判、可能失败。**\n\n所以我一直\"准备\"，从不\"交付\"。\n\n---\n\n### 代价不只是没发布的项目\n\nAI 还指出了我更不想面对的东西：\n\n> *\"这种延迟发布的习惯，已经在生活的其他领域产生连锁反应。\"*\n\n我开始回想。\n\n工作上，我越来越麻木——因为一直在为别人的项目赶 deadline，自己的却永远\"明天再说\"。\n\n家庭里，我愧疚陪伴时间太少——因为下班后的时间都被\"还没准备好\"的个人项目吞噬了。\n\n**最可怕的是——我开始怀疑这些时间投入的价值。**\n\n如果7年前那个应用发布了，现在会怎样？\n如果每次\"准备\"的时间都用来迭代，我现在会有多少产品？\n\n这些问题，我不敢深想。\n\n---\n\n### 所以，怎么破？\n\n好消息是，AI 也看到我的出路了。\n\n> *\"你早已总结出应对之策：熟悉的技术栈、可复用的模板、让 AI 处理杂事。\"*\n\n对，我知道怎么做。\n\n**但知道和做到之间，差着一整个太平洋。**\n\n真正的问题不是技术能力，而是我**对\"未完成\"状态的容忍度**。\n\n我要的不是更多准备，而是**更短的交付周期**。\n\n---\n\n### 我的新实验\n\n读完那份 AI 报告，我做了一个决定：\n\n**下一个想法，不管做成什么样，1周内必须发布。**\n\n粗糙？没关系。\n没人用？没关系。\n被嘲笑？也没关系。\n\n**发布本身，就是胜利。**\n\n因为7年了，我总算明白：\n\n> 产品的成败与投入的工作量没有必然联系。\n> 真正值得交付的，不是完美代码，而是为用户解决问题的能力。\n\n---\n\n### 给同样拖延的你\n\n如果你也像我一样：\n- 笔记里写满了\"道理\"，生活里重复同样的错误\n- 永远在\"准备\"，从不\"交付\"\n- 用新想法逃避真正的行动\n\n试试这个：\n\n**找一个你信任的工具，让它\"审视\"你的记录。**\n\n不是让它帮你整理，而是让它**点破你的模式**。\n\n有时候，我们需要的不是更多建议，而是**被当面戳穿**。\n\n**现在，去发布那个\"还没准备好\"的东西吧。**\n\n它永远不会准备好的。",

    {
      "id": "mv3e9odapb9ly",
      "type": "note",
      "title": "超简单的主题切换技巧",
      "content": "原先这个网站的代码高亮主题是默认暗色的，但是考虑到网站本身已经支持了跟随系统主题自动切换，所以为了保持统一，准备将代码高亮主题跟系统主题自动同步。\n\n一开始我想的还是传统的方式，比如通过添加类，或是在css中添加media查询来实现。后来让AI去实现这个功能时，发现了一个更简单的方式，直接在`<link />`标签中添加`media`属性，利用`prefers-color-scheme`媒体查询在不同的系统主题下加载不同的样式。\n\n```html\n<link rel=\"stylesheet\" href=\"https://unpkg.com/prismjs@1.29.0/themes/prism.css\" media=\"(prefers-color-scheme: light)\">\n<link rel=\"stylesheet\" href=\"https://unpkg.com/prismjs@1.29.0/themes/prism-okaidia.css\" media=\"(prefers-color-scheme: dark)\">\n```\n\n分析了下这个方案，发现了一些有趣的细节。\n\n- 当页面为亮色主题时，会同时下载`prism.css`和`prism-okaidia.css`，但是没有命中的media（暗色主题）不会参与渲染（也就不会阻塞渲染）。\n\n- 虽然两个主题文件都会下载，但是它们的优先级不一样，比如当页面为亮色主题时，`prism.css`比`prism-okaidia.css`的优先级高。\n\n- 如果此时切换为系统或浏览器的主题为暗色，则`prism-okaidia.css`会命中media，就直接渲染了。\n\n- 如果是刷新页面（比如当前系统主题为暗色），两个主题文件会重新下载，但是由于浏览器的缓存机制，所以一般情况下不会重新请求。此时，`prism-okaidia.css`的优先级就比`prism.css`高了。\n![alt text](https://pketh.org/images/2025/lifetime-plans/vegetables.gif)",
